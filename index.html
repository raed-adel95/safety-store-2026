<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SAFETY STORE - Home</title>
  <style>
    body {
      margin: 0;
      margin-left: 160px;
      font-family: Arial;
    }
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 160px;
      height: 100%;
      background: #111;
      border-right: 2px solid #ffcc00;
      padding-top: 20px;
    }
    .sidebar a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 12px 20px;
      cursor: pointer;
    }
    .sidebar a:hover {
      background: #ffcc00;
      color: black;
    }
    .hint {
      color: #ffcc00;
      display: block;
      padding: 0 20px;
      font-size: 11px;
    }
    .header {
      background: black;
      color: white;
      padding: 25px 30px;
      border-bottom: 3px solid #ffcc00;
    }
    .header h1 {
      margin: 0;
    }
    .header span {
      color: #ffcc00;
    }
    .header p {
      margin: 5px 0 0;
      color: #ccc;
    }
    .owner-box {
      display: none;
      background: #111;
      color: white;
      padding: 20px;
      margin: 20px 40px;
      border-left: 4px solid #ffcc00;
    }
    .owner-box h3 {
      margin-top: 0;
      color: #ffcc00;
    }
    .owner-box input, .owner-box select {
      padding: 8px;
      margin: 5px;
    }
    .content {
      padding: 30px 40px;
    }
    h2 {
      border-left: 4px solid #ffcc00;
      padding-left: 10px;
      margin-top: 40px;
    }
    .product {
      display: inline-block;
      border: 1px solid #ccc;
      width: 200px;
      padding: 15px;
      margin: 10px;
      text-align: center;
    }
    .product img {
      width: 140px;
      height: 140px;
    }
    button {
      background: black;
      color: #ffcc00;
      border: none;
      padding: 8px 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <a href="index.html">Home</a>
    <a href="login.html">Log In</a>
    <a href="cart.html">Cart</a>
    <a href="about.html">About Us</a>
    <a href="contact.html">Contact Us</a>
    <a onclick="openOwner()">Owner</a>
    <small class="hint">Pass: 1234</small>
  </div>

  <div class="header">
    <h1><span>//SAFETY</span>STORE</h1>
    <p>Premium Safety Shoes & Workwear in Egypt</p>
  </div>

  <div class="owner-box" id="ownerBox">
    <h3>Add New Product (Owner)</h3>
    <select id="cat">
      <option value="boots">Boots</option>
      <option value="body">Body Protection</option>
      <option value="eye">Eye Protection</option>
      <option value="gloves">Gloves</option>
      <option value="helmets">Helmets</option>
    </select>
    <input type="text" id="pname" placeholder="Product Name">
    <input type="number" id="pprice" placeholder="Price">
    <input type="file" id="pimg" accept="image/*">
    <button onclick="addProduct()">Add Product</button>
  </div>

  <div class="content">
    <h2>BOOTS</h2>
    <div id="boots"></div>

    <h2>Body Protection</h2>
    <div id="body"></div>

    <h2>EYE PROTECTION</h2>
    <div id="eye"></div>

    <h2>GLOVES</h2>
    <div id="gloves"></div>

    <h2>HELMETS</h2>
    <div id="helmets"></div>
  </div>

  <script>
    function openOwner() {
      var pass = prompt("Enter Owner Password:");
      if (pass == "1234") {
        document.getElementById("ownerBox").style.display = "block";
      }
    }

    function showProducts() {
      var cats = ["boots", "body", "eye", "gloves", "helmets"];
      for (var c = 0; c < cats.length; c++) {
        document.getElementById(cats[c]).innerHTML = "";
      }

      var list = JSON.parse(localStorage.getItem("products")) || [];

      for (var i = 0; i < list.length; i++) {
        var p = list[i];
        var box = document.getElementById(p.cat);
        if (box) {
          box.innerHTML +=
            '<div class="product">' +
              '<img src="' + p.img + '">' +
              '<h3>' + p.name + '</h3>' +
              '<p>$' + p.price + '</p>' +
              '<button onclick="addCart(\'' + p.name + '\',' + p.price + ',\'' + p.img + '\')">Add to Cart</button>' +
            '</div>';
        }
      }
    }

    function addProduct() {
      var cat = document.getElementById("cat").value;
      var name = document.getElementById("pname").value;
      var price = document.getElementById("pprice").value;
      var file = document.getElementById("pimg").files[0];

      if (name == "" || price == "" || !file) {
        return;
      }

      var reader = new FileReader();
      reader.onload = function(e) {
        var list = JSON.parse(localStorage.getItem("products")) || [];
        list.push({ cat: cat, name: name, price: price, img: e.target.result });
        localStorage.setItem("products", JSON.stringify(list));

        showProducts();

        document.getElementById("pname").value = "";
        document.getElementById("pprice").value = "";
        document.getElementById("pimg").value = "";
      };
      reader.readAsDataURL(file);
    }

    function addCart(name, price, img) {
      var cart = JSON.parse(localStorage.getItem("cart")) || [];
      cart.push({ name: name, price: price, img: img });
      localStorage.setItem("cart", JSON.stringify(cart));
    }

    showProducts();
  </script>

</body>
</html>
