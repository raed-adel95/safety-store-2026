<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAFETY STORE - Home</title>
  <style>
    body {
      margin: 0;
      margin-left: 160px;
      font-family: Arial;
    }
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 160px;
      height: 100%;
      background: #111;
      border-right: 2px solid #ffcc00;
      padding-top: 20px;
    }
    .sidebar a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 12px 20px;
    }
    .sidebar a:hover {
      background: #ffcc00;
      color: black;
    }
    .hint {
      color: #ffcc00;
      display: block;
      padding: 0 20px;
      font-size: 11px;
    }
    .header {
      background: black;
      color: white;
      padding: 25px 30px;
    }
    .header h1 { margin: 0; }
    .header span { color: #ffcc00; }
    .header p { margin: 5px 0 0; color: #ccc; }

    .caution-tape {
      background: repeating-linear-gradient(
        -45deg,
        #ffcc00,
        #ffcc00 15px,
        #111 15px,
        #111 30px
      );
      padding: 6px;
      text-align: center;
      border-top: 2px solid #111;
      border-bottom: 2px solid #111;
    }
    .caution-tape span {
      background: #ffcc00;
      color: black;
      font-weight: bold;
      font-size: 13px;
      padding: 2px 12px;
      letter-spacing: 2px;
    }

    .content { padding: 30px 40px; }
    h2 {
      border-left: 4px solid #ffcc00;
      padding-left: 10px;
      margin-top: 40px;
    }
    .product {
      display: inline-block;
      border: 1px solid #ccc;
      width: 200px;
      padding: 15px;
      margin: 10px;
      text-align: center;
    }
    .product img, .product h3 {
      cursor: pointer;
    }
    .product img {
      width: 140px;
      height: 140px;
    }
    button {
      background: black;
      color: #ffcc00;
      border: none;
      padding: 8px 15px;
      cursor: pointer;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
    }
    .modal-box {
      background: white;
      width: 300px;
      max-width: 85%;
      margin: 80px auto;
      padding: 20px;
      text-align: center;
      border-top: 4px solid #ffcc00;
      box-sizing: border-box;
    }
    .modal-box img {
      width: 160px;
      height: 160px;
    }
    .close-btn {
      background: #d93025;
      color: white;
      margin-left: 5px;
    }

    @media (max-width: 600px) {
      body {
        margin-left: 0;
      }
      .sidebar {
        position: static;
        width: 100%;
        height: auto;
        border-right: none;
        border-bottom: 2px solid #ffcc00;
        padding: 10px 0;
        text-align: center;
      }
      .sidebar a {
        display: inline-block;
        padding: 8px 10px;
        font-size: 14px;
      }
      .hint {
        display: inline-block;
        padding: 0 5px;
      }
      .content {
        padding: 15px;
        text-align: center;
      }
      h2 {
        text-align: left;
      }
      .product {
        width: 85%;
        margin: 10px auto;
      }
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <a href="index.html">Home</a>
    <a href="login.html">Log In</a>
    <a href="cart.html">Cart</a>
    <a href="aboutus.html">About Us</a>
    <a href="contact.html">Contact Us</a>
    <a href="admin.html">Owner</a>
    <small class="hint">Pass: 1234</small>
  </div>

  <div class="header">
    <h1><span>//SAFETY</span>STORE</h1>
    <p>Premium Safety Shoes & Workwear in Egypt</p>
  </div>

  <div class="caution-tape">
    <span>CAUTION WORK AREA</span>
  </div>

  <div class="content">
    <h2>BOOTS</h2>
    <div id="bootsList"></div>

    <h2>Body Protection</h2>
    <div id="bodyList"></div>

    <h2>EYE PROTECTION</h2>
    <div id="eyeList"></div>

    <h2>GLOVES</h2>
    <div id="glovesList"></div>

    <h2>HELMETS</h2>
    <div id="helmetList"></div>
  </div>

  <!-- نافذة عرض تفاصيل المنتج -->
  <div class="modal" id="detailsModal" onclick="closeDetails()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <img id="mImg">
      <h3 id="mName"></h3>
      <p id="mDesc"></p>
      <h4 id="mPrice"></h4>
      <button id="mCartBtn">Add to Cart</button>
      <button class="close-btn" onclick="closeDetails()">Close</button>
    </div>
  </div>

  <script>
    function showProducts() {
      var cats = ["bootsList", "bodyList", "eyeList", "glovesList", "helmetList"];
      for (var c = 0; c < cats.length; c++) {
        document.getElementById(cats[c]).innerHTML = "";
      }

      var list = JSON.parse(localStorage.getItem("safety_products")) || [];

      for (var i = 0; i < list.length; i++) {
        var p = list[i];
        var box = document.getElementById(p.cat);
        if (box) {
          box.innerHTML +=
            '<div class="product">' +
              '<img src="' + p.img + '" onclick="openDetails(' + i + ')">' +
              '<h3 onclick="openDetails(' + i + ')">' + p.name + '</h3>' +
              '<p>$' + p.price + '</p>' +
              '<button onclick="addCart(\'' + p.name + '\',' + p.price + ',\'' + p.img + '\')">Add to Cart</button>' +
            '</div>';
        }
      }
    }

    function openDetails(index) {
      var list = JSON.parse(localStorage.getItem("safety_products")) || [];
      var p = list[index];

      document.getElementById("mImg").src = p.img;
      document.getElementById("mName").innerText = p.name;
      document.getElementById("mDesc").innerText = p.desc || "Safety equipment product.";
      document.getElementById("mPrice").innerText = "$" + p.price;
      document.getElementById("mCartBtn").onclick = function() {
        addCart(p.name, p.price, p.img);
        closeDetails();
      };

      document.getElementById("detailsModal").style.display = "block";
    }

    function closeDetails() {
      document.getElementById("detailsModal").style.display = "none";
    }

    function addCart(name, price, img) {
      var cart = JSON.parse(localStorage.getItem("safety_cart")) || [];
      cart.push({ name: name, price: price, img: img });
      localStorage.setItem("safety_cart", JSON.stringify(cart));
    }

    showProducts();
  </script>

</body>
</html>
