<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SAFETY EQUIPMENT STORE</title>
  <link rel="stylesheet" href="MAIN PAGE2.CSS">   
  <style>
    .owner-box {
      background-color: #111111;
      color: white;
      padding: 20px;
      margin: 20px auto;
      text-align: center;
      border-bottom: 3px solid #ffcc00;
    }
    .owner-box h3 {
      color: #ffcc00;
      margin-top: 0;
    }
    .owner-box input, .owner-box select {
      padding: 8px;
      margin: 5px;
    }
    .owner-box button {
      background-color: #ffcc00;
      color: black;
      font-weight: bold;
      border: none;
      padding: 9px 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header>
  <div>
    <div class="logo">//<span>SAFETY</span>STORE</div>
    <div class="tagline">Premium Safety Shoes & Workwear in Egypt</div>
  </div>
  <div class="links">
    <a href="login.html">Log In</a> / <a href="cart.html">Cart</a>
  </div>
</header>

<div class="owner-box">
  <h3>ADD NEW PRODUCT (OWNER)</h3>
  <select id="cat">
    <option value="helmetList">HELMET</option>
    <option value="bootsList">BOOTS</option>
    <option value="bodyList">Body Protection</option>
    <option value="eyeList">EYE PROTECTION</option>
    <option value="glovesList">GLOVES</option>
  </select>
  <input type="text" id="pname" placeholder="Product Name">
  <input type="number" id="pprice" placeholder="Price ($)">
  <input type="text" id="pdesc" placeholder="Description">
  <input type="file" id="pimg" accept="image/*">
  <button onclick="addNewProduct()">ADD PRODUCT</button>
</div>

<div class="section">
  <h2>HELMET</h2>
  <div class="products" id="helmetList"></div>
</div>

<div class="section">
  <h2>BOOTS</h2>
  <div class="products" id="bootsList"></div>
</div>

<div class="section">
  <h2>Body Protection</h2>
  <div class="products" id="bodyList"></div>
</div>

<div class="section">
  <h2>EYE PROTECTION</h2>
  <div class="products" id="eyeList"></div>
</div>

<div class="section">
  <h2>GLOVES</h2>
  <div class="products" id="glovesList"></div>
</div>

<div id="detailsBox">
  <div class="details-content">
    <img id="dImg" src="">
    <h2 id="dName"></h2>
    <h3 id="dPrice"></h3>
    <p id="dDesc"></p>
    <button onclick="closeDetails()">Close</button>
  </div>
</div>

<script>
function addToCart(name, price, img) {
  let cart = [];
  if(localStorage.cart) {
    cart = JSON.parse(localStorage.cart);
  }
  cart.push({ name: name, price: price, img: img });
  localStorage.setItem('cart', JSON.stringify(cart));
}

function showDetails(name, price, img, desc) {
  document.getElementById('dName').innerText = name;
  document.getElementById('dPrice').innerText = price;
  document.getElementById('dImg').src = img;
  document.getElementById('dDesc').innerText = desc;
  document.getElementById('detailsBox').style.display = 'block';
}

function closeDetails() {
  document.getElementById('detailsBox').style.display = 'none';
}



function drawProduct(p) {
  document.getElementById(p.cat).innerHTML +=
    '<div class="product">' +
      '<img src="' + p.img + '" alt="' + p.name + '" onclick="showDetails(\'' + p.name + '\', \'' + p.price + '$\', \'' + p.img + '\', \'' + p.desc + '\')">' +
      '<h3>' + p.price + '$</h3>' +
      '<button onclick="addToCart(\'' + p.name + '\', ' + p.price + ', \'' + p.img + '\')">ADD TO CART</button>' +
    '</div>';
}

function addNewProduct() {
  var cat = document.getElementById("cat").value;
  var name = document.getElementById("pname").value;
  var price = document.getElementById("pprice").value;
  var desc = document.getElementById("pdesc").value;
  var file = document.getElementById("pimg").files[0];

  if (name == "" || price == "" || !file) {
    alert("Please fill name, price, and select an image!");
    return;
  }

  var reader = new FileReader();
  reader.onload = function(e) {
    var newItem = {
      cat: cat,
      name: name,
      price: price,
      desc: desc || "Safety equipment product.",
      img: e.target.result
    };

    drawProduct(newItem);

    var saved = JSON.parse(localStorage.getItem("safety_products")) || [];
    saved.push(newItem);
    localStorage.setItem("safety_products", JSON.stringify(saved));

    document.getElementById("pname").value = "";
    document.getElementById("pprice").value = "";
    document.getElementById("pdesc").value = "";
    document.getElementById("pimg").value = "";
  };
  reader.readAsDataURL(file);
}

window.onload = function() {
  var saved = JSON.parse(localStorage.getItem("safety_products")) || [];
  for (var i = 0; i < saved.length; i++) {
    drawProduct(saved[i]);
  }
};
</script> 

<!-- FOOTER -->
<footer style="background-color: black; color: white; text-align: center; padding: 40px 0; border-top: 3px solid #ffcc00;">
  <p>
    <a href="aboutus.html" style="color: #ffcc00; text-decoration: none; font-size: 18px; margin: 0 15px;">
      ABOUT US
    </a>
    |
    <a href="contact.html" style="color: #ffcc00; text-decoration: none; font-size: 18px; margin: 0 15px;">
      CONTACT US
    </a>
  </p>
</footer>

</body>
</html>
