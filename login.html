<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log In</title>
</head>

<body>

    <!-- Login form -->
    <div class="box">
        <h2>Sign Up</h2>

        <input type="text" placeholder="User Name">
        <input type="text" placeholder="Email">
        <input type="password" placeholder="Password">

        <button>Sign Up</button>

        <a href="index.html">Back to Store</a>
    </div>

    <style>
        /* Page background */
        body {
            font-family: Arial;
            background-image: url('images/BOX3.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Login box */
        .box {
            width: 300px;
            padding: 20px;
            border: 2px solid #ffcc00;
            background: white;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        /* Login button */
        button {
            width: 100%;
            padding: 10px;
            background: black;
            color: #ffcc00;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        /* Back link */
        a {
            display: block;
            margin-top: 15px;
            color: black;
            font-weight: bold;
            text-decoration: none;
        }
    </style>

</body>
</html>
