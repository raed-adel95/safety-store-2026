<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cart</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .item {
      display: inline-block;
      border: 1px solid #ccc;
      margin: 10px;
      padding: 10px;
      width: 150px;
    }
    .item img {
      width: 100%;
    }
    .del-btn {
      background: red;
      color: white;
      border: none;
      padding: 6px 12px;
      cursor: pointer;
    }
    #confirmBtn {
      margin-top: 25px;
      padding: 10px 20px;
      background: black;
      color: #ffcc00;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    a {
      color: black;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Your Cart</h1>

  <div id="cart"></div>

  <button id="confirmBtn" onclick="confirmOrder()">CONFIRM ORDER</button>

  <p><a href="index.html">Back to Store</a></p>

  <script>
    var cart = JSON.parse(localStorage.getItem("cart")) || [];
    var box = document.getElementById("cart");
    var btn = document.getElementById("confirmBtn");

    function showCart() {
      box.innerHTML = "";

      if (cart.length == 0) {
        box.innerHTML = "<p>Your cart is empty</p>";
        btn.style.display = "none";
        return;
      }

      btn.style.display = "inline-block";

      for (var i = 0; i < cart.length; i++) {
        box.innerHTML +=
          '<div class="item">' +
            '<img src="' + cart[i].img + '">' +
            '<h3>' + cart[i].name + '</h3>' +
            '<p>$' + cart[i].price + '</p>' +
            '<button class="del-btn" onclick="removeItem(' + i + ')">REMOVE</button>' +
          '</div>';
      }
    }

    function removeItem(index) {
      cart.splice(index, 1);
      localStorage.setItem("cart", JSON.stringify(cart));
      showCart();
    }

    function confirmOrder() {
      cart = [];
      localStorage.removeItem("cart");
      box.innerHTML = "<p>Order confirmed!</p>";
      btn.style.display = "none";
    }

    showCart();
  </script>

</body>
</html>
