<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cart</title>

  <style>
    /* Page style */
    body { 
      font-family: Arial, sans-serif; 
      text-align: center; 
      background-color: white;
    }

    /* Product box */
    .cart-item { 
      display: inline-block; 
      border: 1px solid #ccc; 
      background-color: white;
      margin: 10px; 
      padding: 10px; 
      width: 150px; 
    }

    /* Product image */
    .cart-item img { 
      width: 100%; 
      height: auto; 
    }

    /* Confirm button */
    #confirmBtn { 
      margin-top: 30px; 
      padding: 10px 20px; 
      font-size: 16px; 
      background-color: black;
      color: #ffcc00;
      border: none;
      font-weight: bold;
      cursor: pointer; 
    }

    a {
      color: black;
      font-weight: bold;
    }
  </style>
</head>
<body>

<!-- Page Title -->
<h1>Your Cart</h1>

<!-- Cart items will appear here -->
<div id="cart"></div>

<!-- Confirm order button -->
<button id="confirmBtn">CONFIRM ORDER</button>

<!-- Back to main page -->
<p><a href="index.html">Back to Store</a></p>

<script>
  /* Load cart from localStorage */
  let cart;
  if (localStorage.cart) {
    cart = JSON.parse(localStorage.cart);
  } else {
    cart = [];
  }

  /* Target the cart div */
  const cartDiv = document.getElementById('cart');

  /* If cart is empty */
  if (cart.length === 0) {
    cartDiv.innerHTML = "<p>Your cart is empty</p>";
    document.getElementById('confirmBtn').style.display = 'none';
  } 
  
  /* If cart has items */
  else {
    for (let i = 0; i < cart.length; i++) {
      cartDiv.innerHTML += `
        <div class="cart-item">
          <img src="${cart[i].img}">
          <h3>${cart[i].name}</h3>
          <p>$${cart[i].price}</p>
        </div>
      `;
    }
  }

  /* Confirm button does: clear cart  */
  document.getElementById('confirmBtn').onclick = function() {
    if (cart.length > 0) {
      localStorage.removeItem('cart'); 
      cartDiv.innerHTML = "<p>Order confirmed!</p>";
      document.getElementById('confirmBtn').style.display = 'none';
    }
  };
</script>

</body>
</html>
