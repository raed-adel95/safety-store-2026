<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - SAFETY STORE</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            text-align: center;
        }

        .header {
            background: black;
            color: white;
            padding: 25px;
            border-bottom: 3px solid #ffcc00;
        }

        .header h1 {
            margin: 0;
        }

        .header span {
            color: #ffcc00;
        }

        .header p {
            margin: 5px 0 0;
            color: #ccc;
            font-size: 14px;
        }

        form {
            max-width: 400px;
            width: 85%;
            margin: 35px auto 20px;
            background-color: white;
            padding: 25px;
            border-radius: 6px;
            border-top: 4px solid #ffcc00;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            box-sizing: border-box;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 4px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #ffcc00;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background-color: black;
            color: #ffcc00;
            border: 2px solid #ffcc00;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background-color: #ffcc00;
            color: black;
        }

        #msgStatus {
            color: green;
            font-weight: bold;
            margin-top: 12px;
            display: none;
        }

        .back-link {
            display: inline-block;
            margin: 15px 0 40px;
            text-decoration: none;
            color: black;
            font-weight: bold;
            border-bottom: 2px solid #ffcc00;
            padding-bottom: 3px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1><span>//CONTACT</span> US</h1>
        <p>We are here to help with your safety equipment orders</p>
    </div>

    <form id="contactForm" onsubmit="sendMsg(event)">
        <input type="text" placeholder="Your Name" required>
        <input type="email" placeholder="Your Email" required>
        <textarea rows="5" placeholder="Your Message" required></textarea>
        <button type="submit">SEND MESSAGE</button>
        <p id="msgStatus">✓ Message sent! We will reply soon.</p>
    </form>

    <a class="back-link" href="index.html">← Back to Store</a>

    <script>
        function sendMsg(e) {
            e.preventDefault();
            document.getElementById("msgStatus").style.display = "block";
            document.getElementById("contactForm").reset();
        }
    </script>

</body>
</html>
