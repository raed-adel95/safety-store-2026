<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us - SAFETY STORE</title>
</head>

<body>

    <!-- Page title -->
    <h1>Contact Us</h1>

    <!-- Contact form -->
    <form>
        <input type="text" placeholder="Your Name" required>
        <input type="email" placeholder="Your Email" required>
        <textarea rows="5" placeholder="Your Message" required></textarea>
        <button type="submit">Send Message</button>
    </form>

    <!-- Link back to main store page -->
    <a href="index.html">Back to Store</a>

    <style>
        /* Body styling */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: white;
        }

        /* Page heading */
        h1 {
            color: black;
            border-bottom: 4px solid #ffcc00;
            display: inline-block;
            padding-bottom: 5px;
        }

        /* Form container */
        form {
            max-width: 400px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }

        /* Inputs and textarea */
        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        /* Submit button */
        button {
            padding: 12px 20px;
            background-color: black;
            color: #ffcc00;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #ffcc00;
            color: black;
        }

        /* Back link */
        a {
            display: block;
            margin-top: 20px;
            text-decoration: none;
            color: black;
            font-weight: bold;
        }
    </style>

</body>
</html>
